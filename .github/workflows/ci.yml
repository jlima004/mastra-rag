name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, build and auth smoke
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke-test server authentication and protected Supabase readiness
        env:
          RAG_SERVER_API_TOKEN: ci-only-nonsecret-auth-token-0123456789abcdef
        run: |
          set -euo pipefail
          npm run dev > /tmp/mastra-rag-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          unauth_status=000
          for attempt in $(seq 1 45); do
            unauth_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:4111/internal/readiness/supabase || true)
            if [ "$unauth_status" = '401' ]; then break; fi
            sleep 2
          done

          if [ "$unauth_status" != '401' ]; then
            echo "FAIL: unauthenticated readiness returned status $unauth_status (expected 401)"
            tail -n 60 /tmp/mastra-rag-dev.log
            exit 1
          fi

          authorized_status=$(curl --silent --output /tmp/mastra-supabase-readiness.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${RAG_SERVER_API_TOKEN}" \
            http://127.0.0.1:4111/internal/readiness/supabase)

          if [ "$authorized_status" != '503' ]; then
            echo "FAIL: authenticated readiness returned status $authorized_status (expected 503 without Supabase DSN)"
            tail -n 60 /tmp/mastra-rag-dev.log
            exit 1
          fi

          node -e "const assert = require('node:assert/strict'); const fs = require('node:fs'); assert.deepEqual(JSON.parse(fs.readFileSync('/tmp/mastra-supabase-readiness.json', 'utf8')), {status: 'unavailable', category: 'CONFIGURATION'});"

          echo 'PASS: dev anonymous 401 and authenticated CONFIGURATION 503.'

      - name: Smoke-test bundled server authentication in production mode
        env:
          NODE_ENV: production
          PORT: '4122'
          RAG_SERVER_API_TOKEN: ci-only-nonsecret-auth-token-0123456789abcdef
        run: |
          set -euo pipefail
          node .mastra/output/index.mjs > /tmp/mastra-rag-production.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          unauth_status=000
          for attempt in $(seq 1 45); do
            unauth_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:4122/internal/readiness/supabase || true)
            if [ "$unauth_status" = '401' ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done

          if [ "$unauth_status" != '401' ]; then
            echo "FAIL: production-mode unauthenticated readiness returned $unauth_status (expected 401)"
            tail -n 60 /tmp/mastra-rag-production.log
            exit 1
          fi

          # H7: actual production bundle must reject invalid, inherited-key
          # and alternate-header tokens before entering the readiness handler.
          for invalid in invalid-h7-token __proto__ constructor toString hasOwnProperty; do
            rejected_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${invalid}" \
              http://127.0.0.1:4122/internal/readiness/supabase)
            if [ "$rejected_status" != '401' ]; then
              echo "FAIL: H7 unexpected status $rejected_status for invalid bearer auth"
              exit 1
            fi
          done
          for invalid in __proto__ constructor; do
            rejected_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "X-Playground-Access: ${invalid}" \
              http://127.0.0.1:4122/internal/readiness/supabase)
            if [ "$rejected_status" != '401' ]; then
              echo "FAIL: H7 unexpected status $rejected_status for invalid alternate auth"
              exit 1
            fi
          done

          authorized_status=$(curl --silent --output /tmp/mastra-supabase-readiness.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${RAG_SERVER_API_TOKEN}" \
            http://127.0.0.1:4122/internal/readiness/supabase)

          if [ "$authorized_status" != '503' ]; then
            echo "FAIL: production-mode authenticated readiness returned $authorized_status (expected 503 without Supabase DSN)"
            tail -n 60 /tmp/mastra-rag-production.log
            exit 1
          fi

          node -e "const assert = require('node:assert/strict'); const fs = require('node:fs'); assert.deepEqual(JSON.parse(fs.readFileSync('/tmp/mastra-supabase-readiness.json', 'utf8')), {status: 'unavailable', category: 'CONFIGURATION'});"

          echo 'PASS: production bundle anonymous 401 and authenticated CONFIGURATION 503.'

      - name: Smoke-test disabled Turso durability probe in production bundle
        env:
          NODE_ENV: production
          PORT: '4123'
          RAG_SERVER_API_TOKEN: ci-only-nonsecret-auth-token-0123456789abcdef
        run: |
          set -euo pipefail
          node .mastra/output/index.mjs > /tmp/turso-durability-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          status=000
          for attempt in $(seq 1 45); do
            status=$(curl --silent --request POST --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:4123/internal/durability/turso/create || true)
            if [ "$status" = '401' ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          test "$status" = 401 || { echo 'FAIL: anonymous durability route must return 401'; exit 1; }

          disabled_status=$(curl --silent --request POST --output /tmp/turso-disabled.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${RAG_SERVER_API_TOKEN}" \
            http://127.0.0.1:4123/internal/durability/turso/create)
          test "$disabled_status" = 404 || { echo "FAIL: durability route returned $disabled_status"; exit 1; }
          node -e "const a=require('node:assert/strict'); const fs=require('node:fs'); a.deepEqual(JSON.parse(fs.readFileSync('/tmp/turso-disabled.json','utf8')), {status:'disabled'});"
          echo 'PASS: Turso durability probe is authenticated and disabled by default.'

  e1-local-postgres:
    name: E1 disposable PostgreSQL 17 + PgVector migration/RLS checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e1-local-ci-only
          POSTGRES_DB: rag_e1
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_e1"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify catalog up/down/up, rendered identity, RLS, namespace and local flat PgVector
        env:
          E1_LOCAL_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-e1-local.sh
      - name: Verify synthetic rag schema backup and isolated logical restore
        env:
          E1_LOCAL_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-e1-restore-local.sh
      - name: Verify operator role contract and isolated security advisor reproduction
        env:
          E1_LOCAL_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-e1-operator-local.sh
      - name: Verify isolated PostgREST RPC behavior and event-trigger regression (synthetic only)
        env:
          E1_LOCAL_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-e1-h6-postgrest-local.sh


  e1-h6-role-pre-catalog:
    name: E1 H6 disposable pre-catalog rag_app provisioning proof
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e1-role-local-ci-only
          POSTGRES_DB: rag_e1_role
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_e1_role"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prove minimal role creation and replay stop in independent disposable PG17
        env:
          E1_RAG_APP_LOCAL_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-e1-rag-app-provision-local.sh

  e1-operator-cli:
    name: E1 offline pinned Supabase CLI v3 migration rehearsal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: '3.1.0'
      - name: Check local-only migration generation and CLI targeting flags
        run: bash scripts/check-e1-cli-offline.sh
      - name: Prove H5 operator-only remote history script is read-only (fake CLI, no secrets)
        run: bash scripts/test-e1-h5-remote-history-offline.sh
