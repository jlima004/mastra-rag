name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, build and auth smoke
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke-test server authentication and protected Supabase readiness
        env:
          RAG_SERVER_API_TOKEN: ci-only-nonsecret-auth-token-0123456789abcdef
        run: |
          set -euo pipefail
          npm run dev > /tmp/mastra-rag-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          unauth_status=000
          for attempt in $(seq 1 45); do
            unauth_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:4111/internal/readiness/supabase || true)
            if [ "$unauth_status" = '401' ]; then break; fi
            sleep 2
          done

          if [ "$unauth_status" != '401' ]; then
            echo "FAIL: unauthenticated readiness returned status $unauth_status (expected 401)"
            tail -n 60 /tmp/mastra-rag-dev.log
            exit 1
          fi

          authorized_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${RAG_SERVER_API_TOKEN}" \
            http://127.0.0.1:4111/internal/readiness/supabase)

          if [ "$authorized_status" != '503' ]; then
            echo "FAIL: authenticated readiness returned status $authorized_status (expected 503 without Supabase DSN)"
            tail -n 60 /tmp/mastra-rag-dev.log
            exit 1
          fi

          echo 'PASS: unauthenticated requests denied; authenticated read-only readiness is executed.'
